<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muvaffaqiyatli - Galaktika</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #7b2cbf;
            --orange: #ff7b00;
            --bg: #f4f7f6;
            --white: #ffffff;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: var(--bg);
            font-family: 'Poppins', sans-serif;
        }

        .success-card {
            background: var(--white);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 420px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .icon-box {
            width: 90px;
            height: 90px;
            background: #f0fdf4;
            color: #22c55e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
        }

        .icon-box svg {
            width: 45px;
            height: 45px;
            fill: none;
            stroke: currentColor;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            animation: drawCheck 0.6s ease-out 0.4s both;
        }

        @keyframes drawCheck {
            from { stroke-dasharray: 50; stroke-dashoffset: 50; }
            to { stroke-dasharray: 50; stroke-dashoffset: 0; }
        }

        h1 {
            color: #1a1a1a;
            font-size: 26px;
            margin-bottom: 12px;
        }

        p {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .btn-next {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--purple);
            color: white;
            padding: 16px 40px;
            border-radius: 18px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-next:hover {
            background: #6a1b9a;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(123, 44, 191, 0.25);
        }

        .btn-next svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s;
        }

        .btn-next:hover svg {
            transform: translateX(5px);
        }
    </style>
</head>
<body>

<div class="success-card">
    <div class="icon-box">
        <svg viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
    </div>
    
    <h1>Tayyor!</h1>
    <p>Ma'lumotlaringiz muvaffaqiyatli saqlandi. Galaktika olamiga xush kelibsiz!
    Endi Sign Up qiling
    </p>
    
    <a href="{% url 'login' %}" class="btn-next">
        Keyingisi
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
        </svg>
    </a>
</div>

</body>
</html>
